<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeXR camera calibration target</title>
<style>
html,body{margin:0;background:#fff;color:#111;font:16px system-ui}main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;box-sizing:border-box;padding:1vh 1vw}svg{display:block;width:min(96vw,120vh);height:auto;max-height:90vh}p{margin:4px;text-align:center}small{color:#444}@media(max-height:500px){p{font-size:12px}}
</style></head><body><main>
<svg viewBox="-1 -1 12 9" role="img" aria-label="10 by 7 checkerboard squares, 9 by 6 inside corners, with a white border" xmlns="http://www.w3.org/2000/svg">
<defs><pattern id="checker" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="white"/><rect width="1" height="1" fill="black"/><rect x="1" y="1" width="1" height="1" fill="black"/></pattern></defs>
<rect x="-1" y="-1" width="12" height="9" fill="white"/><rect width="10" height="7" fill="url(#checker)"/>
</svg>
<p><strong>EdgeXR calibration target</strong> · 10 × 7 squares · 9 × 6 inner corners</p>
<small>Keep this display size fixed during the recording. One square-wide white border is part of the target.</small>
</main></body></html>
